<h1 mat-dialog-title class="dialog-title">{{'split_unsure_match_dialog.title' | translate}}</h1>
<div class="dialog">
  <h3 style="text-align: justify">{{'split_unsure_match_dialog.text1' | translate}}</h3>
  <br />
  <h4 style="font-weight: 100; text-align: justify">
    {{'split_unsure_match_dialog.text2' | translate}}
  </h4>
  <div mat-dialog-actions>
    <button mat-raised-button class="submitBreak" (click)="cancel()">
      {{'button_cancel' | translate}}
    </button>
    <button mat-raised-button class="submit" [disabled]="inProgress" type="submit" (click)="onSplit()">
      {{'split_unsure_match_dialog.button_confirm' | translate}}
      <mat-icon *ngIf="inProgress"><mat-spinner diameter="20"></mat-spinner></mat-icon>
    </button>
  </div>
</div>
